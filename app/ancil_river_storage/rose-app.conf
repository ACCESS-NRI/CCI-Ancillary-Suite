[command]
default = python ancil_river_storage.py ${ROUTING_SOURCE} ${STORAGE_SOURCE} \
	    = -o=${OUTPUT} --ants-config=${ANTS_CONFIG}

[env]
# Routing data from ancil_river_routing
ROUTING_SOURCE=${ANCIL_TARGET_PATH}/rivers/qrparm.rivseq

# Storage data from ancil_river_storage_preproc
STORAGE_SOURCE=${ANCIL_TARGET_PATH}/preproc/fekete_storage_data.nc

# Where to write the output
OUTPUT=${ANCIL_TARGET_PATH}/rivers/qrclim.rivstor

# App configuration
ANTS_CONFIG=${PWD}/rose-app-run.conf

[ants_regridding_horizontal]
scheme=Linear
