[command]
# This is an optional pre-processing step, which should only happen a new year of the
# CCI land cover is to be processed.
default = python preprocess_CCI_water.py --land-cover=${LAND_COVER_SOURCE} \
	= --water-bodies=${WATER_BODIES_SOURCE} --output=${OUTPUT}

[env]
# Resulting path for the land cover file
LAND_COVER_SOURCE=/g/data/cm45/access-nri/esacci/land_cover_maps/v2.0.7/ESACCI-LC-L4-LCCS-Map-300m-P1Y-${CCI_YEAR}-v2.0.7b.nc

# Source water bodies dataset
WATER_BODIES_SOURCE=/scratch/rp23/lw5085/ESACCI-LC-L4-WB-Ocean-Land-Map-150m-P13Y-2000-v4.0.nc

# Where to write the output
OUTPUT=${ANCIL_TARGET_PATH}/preproc/ESACCI-LCCS-and-Water-Bodies.nc

[file:${ANCIL_TARGET_PATH}/preproc]
mode=mkdir
