[command]
# This doesn't seem to be dependent on the resolution or other ancillaries.
# Why does it need to be part of the suite?
default = python ancil_orography_filtered_preproc.py \
	= ${SOURCE} -o=${OUTPUT}

[env]
#Source data to use for orography
SOURCE=${ANCIL_MASTER}/atmos/master/orography/GMTED_RAMP2/v2/qrparm.orog

# Where to write the output
OUTPUT=${ANCIL_TARGET_PATH}/orography/qrparm.orog_filtered_preproc.nc
