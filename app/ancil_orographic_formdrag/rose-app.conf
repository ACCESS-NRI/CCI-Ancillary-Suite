[command]
default = python ancil_orographic_formdrag.py ${OROGRAPGHY_SOURCE} \
	= --target-lsm=${TARGET_LSM} -o=${OUTPUT}

[env]
# Preprocessed orography source from ancil_orographic_formdrag_preproc
OROGRAPHY_SOURCE=${ANCIL_TARGET_PATH}/orography/orog_formdrag_preproc.ash.nc

# Target LSM to project onto, from ancil_LCT
TARGET_LSM=${ANCIL_TARGET_PATH}/qrparm.mask.nc

# Where to write the output
OUTPUT=${ANCIL_TARGET_PATH}/orography/qrparm.ash
