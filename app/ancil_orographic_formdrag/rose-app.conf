[command]
default = python ancil_orographic_formdrag.py ${OROGRAPHY_SOURCE} \
	= --target-lsm=${TARGET_LSM} -o=${OUTPUT} --ants-config=${ANTS_CONFIG}

[env]
# Preprocessed orography source from ancil_orographic_formdrag_preproc
OROGRAPHY_SOURCE=${ANCIL_TARGET_PATH}/orography/orog_formdrag_preproc.ash.nc

# Target LSM to project onto, from ancil_LCT
TARGET_LSM=${ANCIL_TARGET_PATH}/land_sea_mask/qrparm.mask.nc

# Where to write the output
OUTPUT=${ANCIL_TARGET_PATH}/orography/qrparm.ash

# App configuration
ANTS_CONFIG=${PWD}/rose-app-run.conf

[ants_decomposition]
x_split=10
y_split=10

[ants_regridding_horizontal]
scheme=TwoStage
