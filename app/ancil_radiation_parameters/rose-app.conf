[command]
# Calculate radiation parameters using the orography
default = python ancil_radiation_parameters.py ${OROGRAPHY_SOURCE} \
	= --target-lsm=${TARGET_LSM} -o=${OUTPUT} --ants-config=${ANTS_CONFIG}

[env]
# Source data for the orography, from ancil_unfiltered_orography_preproc
OROGRAPHY_SOURCE=${ANCIL_TARGET_PATH}/orography/qrparm.orog_unfiltered_preproc.nc

# Target LSM to project onto, from ancil_LCT
TARGET_LSM=${ANCIL_TARGET_PATH}/qrparm.mask.nc

# Where to write the output
OUTPUT=${ANCIL_TARGET_PATH}/orography/qrparm.orog_radiation_parameters

# App configuration
ANTS_CONFIG=${PWD}/rose-app-run.conf

[ants_decomposition]
x_split=10
y_split=10

[ants_regridding_horizontal]
scheme=TwoStage
