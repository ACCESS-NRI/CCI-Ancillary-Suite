[command]
# Create the ocean colour ancillaries
default = python ancil_general_regrid.py ${SEA_COLOUR_SOURCE} \
	= --target-lsm=${TARGET_LSM} -o=${OUTPUT}

[env]
# Source data for the sea colour
SEA_COLOUR_SOURCE=${ANCIL_MASTER}/atmos/master/sea_clim/GlobColour/v2/qrparm.sea.nc

# Target LSM to project onto, from ancil_LCT
TARGET_LSM=${ANCIL_TARGET_PATH}/qrparm.mask.nc

# Where to write the output to
OUTPUT=${ANCIL_TARGET_PATH}/qrclim.sea
