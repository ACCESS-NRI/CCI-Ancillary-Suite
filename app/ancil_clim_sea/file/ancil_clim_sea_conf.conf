[command]
default=ants-launch ancil_general_regrid.py --ants-config ${ANTS_CONFIG} \
       =${source} --target-lsm ${target_lsm} --invert-mask -o ${output} --use-new-saver

[env]
ANTS_CONFIG=${PWD}/rose-app-run.conf
output=${ANCIL_TARGET_PATH}/${MODEL}/general_sea/GlobColour/qrclim.sea
source=${ANCIL_MASTER}/sea_clim/GlobColour/v2/qrparm.sea.nc
target_lsm=${ANCIL_TARGET_PATH}/${MODEL}/land_sea_mask/${MASKMODEL}/qrparm.mask_sea

[ants_regridding_horizontal]
scheme=Linear

[ants_decomposition]
x_split=4
y_split=5

[ants_metadata]
history=${CYLC_SUITE_NAME}@${ROSE_SUITE_REVISION}:${ROSE_TASK_NAME}
