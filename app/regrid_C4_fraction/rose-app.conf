[command]
default = python ancil_general_regrid.py ${C4_SOURCE} --netcdf-only \
	= --target-lsm=${TARGET_LSM} -o=${OUTPUT} --ants-config=${ANTS_CONFIG}

[env]
# Source for the C4 grass fractions
C4_SOURCE=${ANCIL_MASTER}/atmos/master/vegetation/cover/cci/v3/c4_percent_1d.nc

# Mask generated by ancil_lct
TARGET_LSM=${ANCIL_TARGET_PATH}/land_sea_mask/qrparm.mask.nc

# Where to write the regridded fractions to
OUTPUT=${ANCIL_TARGET_PATH}/regridded/regridded_c4_fraction

# App configuration
ANTS_CONFIG=${PWD}/rose-app-run.conf

[ants_decomposition]
x_split=10
y_split=10

[ants_regridding_horizontal]
scheme=TwoStage
