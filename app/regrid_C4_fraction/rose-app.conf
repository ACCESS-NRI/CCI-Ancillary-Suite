[command]
default = python ancil_general_regrid.py ${C4_SOURCE}
	= --target-lsm=${TARGET_LSM} -o=${OUTPUT}

[env]
# Source for the C4 grass fractions
C4_SOURCE=${ANCIL_MASTER}/atmos/master/vegetation/cover/cci/v3/c4_percent_1d.nc

# Mask generated by ancil_lct
TARGET_LSM=${ANCIL_TARGET_PATH}/qrparm.mask.nc

# Where to write the regridded fractions to
OUTPUT=${ANCIL_TARGET_PATH}/regridded/regridded_c4_fraction.nc
