[command]
# The GRASS_MAPPING file comes from the flow.cylc file, as it changes depending on whether
# we're using CABLE or JULES.
default = python ancil_split_grass_types.py ${GRASS_SOURCE} \
	= --original-fractions=${ORIG_FRACTIONS} --grass-mapping=${GRASS_MAPPING} \
	= --output=${OUTPUT}

[env]
# Source that contains the information to split the grass types
GRASS_SOURCE=${ANCIL_TARGET_PATH}/regridded/NCAR-LULCC.nc

# Current land cover fractions
ORIG_FRACTIONS=${ANCIL_TARGET_PATH}/vegetation/qrparm.veg.frac_cci.nc

# Where to write the new land cover
OUTPUT=${ANCIL_TARGET_PATH}/qrparm.veg.frac
