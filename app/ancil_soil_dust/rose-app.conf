[command]
# Creates dust ancillaries based on silt, clay and sand fractions
default = python ancil_soil_dust.py ${SOIL_SOURCE} \
	= --lct-ancillary=${LCT_SOURCE} -o=${OUTPUT}

[env]
# Generated soil source to use
SOIL_SOURCE=${ANCIL_TARGET_PATH}/soil/qrparm.soil_cci.nc

# Land cover generated by ancil_lct
LCT_SOURCE=${ANCIL_TARGET_PATH}/vegetation/qrparm.veg.frac_cci

# Where to write the output
OUTPUT=${ANCIL_TARGET_PATH}/soil/qrparm.soil.dust
