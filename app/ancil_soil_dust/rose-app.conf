[command]
# Creates dust ancillaries based on silt, clay and sand fractions
default = python ancil_soil_dust.py ${SOIL_SOURCE} \
	    = --lct-ancillary=${LCT_SOURCE} -o=${OUTPUT} --ants-config=${ANTS_CONFIG}

[env]
# Generated soil source to use
SOIL_SOURCE=${ANCIL_TARGET_PATH}/soil/qrparm.soil.nc

# Land cover generated by ancil_lct
LCT_SOURCE=${ANCIL_TARGET_PATH}/vegetation/qrparm.veg.frac

# Where to write the output
OUTPUT=${ANCIL_TARGET_PATH}/soil/qrparm.soil.dust

# App configuration
ANTS_CONFIG=${PWD}/rose-app-run.conf

[ants_decomposition]
x_split=10
y_split=10

[ants_regridding_horizontal]
scheme=TwoStage
