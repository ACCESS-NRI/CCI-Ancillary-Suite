[command]
# The MODEL_C3_GRASS_TILE and MODEL_C4_GRASS_TILE are set in flow.cylc,
# based on the specified land model.
default	= python ancil_lct_postproc_c4.py ${VEGETATION_SOURCE} ${C4_SOURCE} \
	= --islscpiic4 --c3level=${MODEL_C3_GRASS_TILE} --c4level=${MODEL_C4_GRASS_TILE}
	= -o=${OUTPUT}

[env]
# Source land cover fractions from ancil_lct
VEGETATION_SOURCE=${ANCIL_TARGET_PATH}/vegetation/qrparm.veg.frac_cci_pre_c4

# Regridded source for C4 fraction
C4_SOURCE=${ANCIL_TARGET_PATH}/regridded/regridded_c4_fraction.nc

# Where to write the output
OUTPUT=${ANCIL_TARGET_PATH}/vegetation/qrparm.veg.frac_cci
