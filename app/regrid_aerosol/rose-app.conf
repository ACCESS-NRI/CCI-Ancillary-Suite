[command]
# Regrid the aerosols onto the desired grid. VERTICAL_DISCRETIZATION is set
# in rose-suite.conf
default = python ancil_general_regrid.py ${AEROSOL_SOURCE} \
	    = --target-grid ${TARGET_OROGRAPHIC_LSM} ${VERTICAL_DISCRETIZATION} \
	    = -o=${OUTPUT} --save-ukca --ants-config=${ANTS_CONFIG}

[env]
# Preprocessed aerosol sources from ancil_aeroclim_preproc
AEROSOL_SOURCE=${ANCIL_TARGET_PATH}/preproc/qrclim.pre_aerosols.nc

# Where to write the output
OUTPUT=${ANCIL_TARGET_PATH}/aerosols/qrclim.aerosols.nc

# App configuration
ANTS_CONFIG=${PWD}/rose-app-run.conf

[ants_decomposition]
x_split=10
y_split=10

[ants_regridding_vertical]
scheme=Linear

[ants_regridding_horizontal]
scheme=TwoStage
