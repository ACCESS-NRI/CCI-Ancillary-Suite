[command]
# Regrid the sea ice
default = python ancil_general_regrid.py ${SST_SOURCE} \
	    = --target-lsm=${TARGET_OCEAN} \
	    = -o=${OUTPUT} --ants-config=${ANTS_CONFIG}

[env]
# Source for the SST ancillaries- Calendar is set in rose-suite.conf
SST_SOURCE=${ANCIL_MASTER}/atmos/master/sst/reynolds/198109_201912_${CALENDAR}/v1/reynolds_sst.nc

# Where to write the output to
OUTPUT=${ANCIL_TARGET_PATH}/ocean/qrclim.sst

# App configuration
ANTS_CONFIG=${PWD}/rose-app-run.conf

[ants_decomposition]
x_split=10
y_split=10

[ants_regridding_horizontal]
scheme=Linear
