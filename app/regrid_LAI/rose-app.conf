[command]
default = python ancil_general_regrid.py ${LAI_SOURCE}
	= --target-lsm=${TARGET_LSM} -o=${OUTPUT}

[env]
# Source of the LAI data to regrid
LAI_SOURCE=${ANCIL_MASTER}/atmos/master/vegatation/lai/modis_4km/v2/lai_preprocessed.nc

# Mask generated by ancil_lct
TARGET_LSM=${ANCIL_TARGET_PATH}/qrparm.mask.nc

# Where to write the regridded LAI to
OUTPUT=${ANCIL_TARGET_PATH}/regridded/regridded_lai.nc
