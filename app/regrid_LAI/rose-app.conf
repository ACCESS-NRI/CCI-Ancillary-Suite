[command]
default = python ancil_general_regrid.py ${LAI_SOURCE} --netcdf-only \
	= --target-lsm=${TARGET_LSM} -o=${OUTPUT} --ants-config=${ANTS_CONFIG}

[env]
# Source of the LAI data to regrid
LAI_SOURCE=${ANCIL_MASTER}/atmos/master/vegetation/lai/modis_4km/v2/lai_preprocessed.nc

# Mask generated by ancil_lct
TARGET_LSM=${ANCIL_TARGET_PATH}/qrparm.mask.nc

# Where to write the regridded LAI to
OUTPUT=${ANCIL_TARGET_PATH}/regridded/regridded_lai

# App configuration
ANTS_CONFIG=${PWD}/rose-app-run.conf

[ants_decomposition]
x_split=10
y_split=10

[ants_regridding_horizontal]
scheme=TwoStage
