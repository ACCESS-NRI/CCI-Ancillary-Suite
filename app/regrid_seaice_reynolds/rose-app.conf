[command]
# Regrid the sea ice
default = python ancil_general_regrid.py ${SEAICE_SOURCE} \
	= --target-lsm=${TARGET_LSM} --invert-mask
	= -o=${OUTPUT}

[env]
# Source for the sea ice ancillaries- Calendar is set in rose-suite.conf
SEAICE_SOURCE=${ANCIL_MASTER}/atmos/master/seaice/reynolds/198909_201912_${CALENDAR}/v1/reynolds_seaice.nc

# Target LSM to project onto, from ancil_LCT
TARGET_LSM=${ANCIL_TARGET_PATH}/qrparm.mask.nc

# Where to write the output to
OUTPUT=${ANCIL_TARGET_PATH}/ocean/qrclim.seaice
