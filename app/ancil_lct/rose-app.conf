[command]
default=python ancil_lct.py ${LAND_COVER_SOURCE} ${GRID_ARG} \
       =--transform-path=${TRANSFORM_FILE} --landseamask-output=${OUTPUT_LSM_PATH} \
       =--ice-tile-id=${MODEL_ICE_TILE} --soil-tile-id=${MODEL_SOIL_TILE}

# GRID_ARG, MODEL_ICE_TILE and MODEL_SOIL_TILE are set in the main `flow.cylc`, based on the choices
# of GRID_SOURCE and LAND_MODEL in the rose-suite.conf. 
[env]
# Default land cover source to use
LAND_COVER_SOURCE=/scratch/rp23/lw5085/ESACCI-LC-L4-LCCS-Map-300m-P1Y-2015-v2.0.7b-water-fixed.nc

# Default transform file, which typically lives in the ./file directory. This can be overridden for
# user defined transforms.
TRANSFORM_FILE=${DEFAULT_TRANSFORM}

# Output for the vegetation fractions
OUTPUT=${ANCIL_TARGET_PATH}/qrparm.veg.frac_cci_pre_c4

# The directory to write the landseamask to. The file name is fixed.
LSM_OUTPUT_PATH=${ANCIL_TARGET_PATH}
