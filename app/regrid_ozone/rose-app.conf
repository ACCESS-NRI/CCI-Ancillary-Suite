[command]
# Regrid the ozone onto the model grid. VERTICAL_DISCRETIZATION is set
# in rose-suite.conf.
default = python ancil_general_regrid.py ${OZONE_SOURCE} \
	= --target-grid ${TARGET_LSM} ${VERTICAL_DISCRETIZATION} \
	= -o=${OUTPUT}

[env]
# Source data for the ozone
OZONE_SOURCE=${ANCIL_MASTER}/atmos/master/CMIP5_SPARCex/1994-2005/v2/Ozone_CMIP5_SPARCex_M1994-2005_N36L70_li-ch_G.nc

# Target orographic grid to project onto, from ancil_orographic_wavedrag
TARGET_LSM=${ANCIL_TARGET_PATH}/orography/qrparm.orog_wavedrag.nc

# Where to write the output
OUTPUT=${ANCIL_TARGET_PATH}/ozone/qrclim_ozone
