[command]
# Regrid the ozone onto the model grid. VERTICAL_DISCRETIZATION is set
# in rose-suite.conf.
default = python ancil_general_regrid.py ${OZONE_SOURCE} \
	    = --target-grid ${TARGET_OROGRAPHIC_LSM} ${VERTICAL_DISCRETIZATION} \
	    = -o=${OUTPUT} --ants-config=${ANTS_CONFIG}

[env]
# Source data for the ozone
OZONE_SOURCE=${ANCIL_MASTER}/atmos/master/ozone/CMIP5_SPARCex/1994-2005/v2/Ozone_CMIP5_SPARCex_M1994-2005_N36L70_li-ch_G.nc

# Where to write the output
OUTPUT=${ANCIL_TARGET_PATH}/ozone/qrclim.ozone

# App configuration
ANTS_CONFIG=${PWD}/rose-app-run.conf

[ants_decomposition]
x_split=1
y_split=10

[ants_regridding_horizontal]
scheme=Linear

[ants_regridding_vertical]
scheme=Linear
