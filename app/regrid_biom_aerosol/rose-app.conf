[command]
# Regrid the ozone onto the model grid. TARGET_OROGRAPHIC_LSM and
# VERTICAL_DISCRETIZATION are set in flow.cylc.
default = python ancil_general_regrid.py ${BIOM_SOURCE} \
	    = --target-grid ${TARGET_OROGRAPHIC_LSM} ${VERTICAL_DISCRETIZATION} \
        = -o=${OUTPUT} --ants-config=${ANTS_CONFIG}

[env]
# Source data for sea salt
BIOM_SOURCE=${ANCIL_MASTER}/atmos/master/aero_clims/GA6.0_antie/v1/qrclim.bio.nc

# Where to write the output
OUTPUT=${ANCIL_TARGET_PATH}/aerosols/qrclim.biom

ANTS_CONFIG=${PWD}/rose-app-run.conf

[ants_decomposition]
x_split=4
y_split=4

[ants_regridding_horizontal]
scheme=Linear

[ants_regridding_vertical]
scheme=Linear
